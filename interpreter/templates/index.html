<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="통역앱" />
  <meta name="theme-color" content="#6c63ff" />

  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <link rel="stylesheet" href="/static/css/style.css" />

  <title>한국어 → 따갈로그어 통역</title>
</head>
<body>
  <div class="app">

    <!-- Status bar (safe area aware) -->
    <div class="top-bar">
      <span id="status-text" class="status-text">준비 중…</span>
      <span id="conn-dot" class="conn-dot"></span>
    </div>

    <!-- Main content -->
    <main class="main">

      <!-- ── VOICE TAB ── -->
      <section id="tab-voice" class="tab-pane active">
        <div class="result-card" id="result-card">
          <div class="result-row" id="row-ko">
            <span class="lang-badge ko">KO · 한국어</span>
            <p id="txt-ko" class="result-txt placeholder">음성을 기다리는 중…</p>
          </div>
          <div class="result-row" id="row-en">
            <span class="lang-badge en">EN · English</span>
            <p id="txt-en" class="result-txt secondary placeholder">–</p>
          </div>
          <div class="result-row" id="row-tl">
            <span class="lang-badge tl">TL · Tagalog</span>
            <p id="txt-tl" class="result-txt main placeholder">–</p>
          </div>
        </div>

        <div class="options-strip">
          <label class="chip-toggle">
            <input type="checkbox" id="chk-speak" checked />
            <span>🔊 음성 출력</span>
          </label>
          <label class="chip-toggle">
            <input type="checkbox" id="chk-continuous" />
            <span>🔄 연속 모드</span>
          </label>
        </div>

        <!-- Big mic button -->
        <div class="mic-wrap">
          <button id="btn-mic" class="btn-mic" aria-label="녹음">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="2" width="6" height="12" rx="3"/>
              <path d="M5 10a7 7 0 0 0 14 0"/>
              <line x1="12" y1="17" x2="12" y2="22"/>
              <line x1="8" y1="22" x2="16" y2="22"/>
            </svg>
            <span id="mic-label">녹음 시작</span>
          </button>
          <div id="wave" class="wave hidden">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
      </section>

      <!-- ── TEXT TAB ── -->
      <section id="tab-text" class="tab-pane">
        <textarea id="inp-text"
          placeholder="한국어 텍스트를 입력하세요…&#10;(Ctrl+Enter 로 번역)"
          rows="5"
        ></textarea>

        <div class="options-strip">
          <label class="chip-toggle">
            <input type="checkbox" id="chk-speak-text" checked />
            <span>🔊 음성 출력</span>
          </label>
          <button id="btn-translate" class="btn-translate">번역 →</button>
        </div>

        <div class="result-card" id="text-result-card" style="display:none">
          <div class="result-row">
            <span class="lang-badge ko">KO · 한국어</span>
            <p id="t-ko" class="result-txt"></p>
          </div>
          <div class="result-row">
            <span class="lang-badge en">EN · English</span>
            <p id="t-en" class="result-txt secondary"></p>
          </div>
          <div class="result-row">
            <span class="lang-badge tl">TL · Tagalog</span>
            <p id="t-tl" class="result-txt main"></p>
          </div>
        </div>
      </section>

      <!-- ── HISTORY TAB ── -->
      <section id="tab-history" class="tab-pane">
        <div class="history-toolbar">
          <span class="history-title">번역 기록</span>
          <button id="btn-clear" class="btn-ghost">지우기</button>
        </div>
        <div id="history-list" class="history-list">
          <p class="empty-hint">기록이 없습니다.</p>
        </div>
      </section>

    </main>

    <!-- Bottom navigation (mobile-friendly) -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/>
          <line x1="12" y1="17" x2="12" y2="22"/>
        </svg>
        <span>음성</span>
      </button>
      <button class="nav-btn" data-tab="text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="7" y1="8" x2="17" y2="8"/>
          <line x1="7" y1="12" x2="17" y2="12"/>
          <line x1="7" y1="16" x2="13" y2="16"/>
        </svg>
        <span>텍스트</span>
      </button>
      <button class="nav-btn" data-tab="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>기록</span>
      </button>
    </nav>

  </div><!-- .app -->

  <!-- Loading overlay -->
  <div id="overlay" class="overlay hidden">
    <div class="spinner"></div>
    <p id="overlay-msg">번역 중…</p>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- socket.io served by Flask-SocketIO (always works, no internet needed) -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js').catch(() => {});
    }
    // Handle ?tab= from PWA shortcuts
    const urlTab = new URLSearchParams(location.search).get('tab');
    if (urlTab) {
      document.querySelector(`[data-tab="${urlTab}"]`)?.click();
    }
  </script>
</body>
</html>
